name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Create local.properties
      run: |
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        echo "MAPS_API_KEY=dummy" >> local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run tests with Gradle
      run: |
        ./gradlew :qweather:test
        ./gradlew :plugin-water:test
        ./gradlew :plugin-food:test
        ./gradlew :plugin-medication:test
        ./gradlew :plugin-parcel:test

    - name: Build Debug APKs
      run: |
        ./gradlew :qweather:assembleDebug
        ./gradlew :plugin-water:assembleDebug
        ./gradlew :plugin-food:assembleDebug
        ./gradlew :plugin-medication:assembleDebug

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: smartspacer-plugins-debug-apks
        path: "**/build/outputs/apk/debug/*.apk"
