name: Android CI

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:
    inputs:
      build_all:
        description: "Build and test all plugins"
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    runs-on: ubuntu-latest

    outputs:
      has_changes: ${{ steps.detect.outputs.has_changes }}
      test_tasks: ${{ steps.detect.outputs.test_tasks }}
      build_tasks: ${{ steps.detect.outputs.build_tasks }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect affected modules
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          BUILD_ALL: ${{ inputs.build_all || false }}

        run: |
          set -euo pipefail

          if [[ "$BUILD_ALL" == "true" ]]; then
            changed_files="<manual build all>"
            force_all=true

          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$BASE_REF"
            changed_files="$(git diff --name-only "origin/$BASE_REF...HEAD")"
            force_all=false

          elif [[ -n "$BEFORE_SHA" &&
                  "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$SHA")"
            force_all=false

          else
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$SHA")"
            force_all=false
          fi

          export CHANGED_FILES="$changed_files"
          export FORCE_ALL="$force_all"

          python3 <<'PY'
          import os
          from pathlib import PurePosixPath

          # 可生成 APK 的应用模块
          apps = [
              "aftership",
              "amazon",
              "battery",
              "bbcweather",
              "controls",
              "countdown",
              "datausage",
              "energymonitor",
              "googlefinance",
              "googlekeep",
              "googlewallet",
              "healthconnect",
              "notifications",
              "pokemongo",
              "qweather",
              "samsunghealth",
              "sunrisesunset",
              "tasker",
              "uber",
              "yahoosport",
              "youtube",
              "plugin-water",
              "plugin-food",
              "plugin-medication",
              "plugin-parcel",
              "plugin-travel-suggestion",
              "plugin-check-in",
          ]

          changed = [
              line
              for line in os.environ["CHANGED_FILES"].splitlines()
              if line
          ]

          force_all = os.environ["FORCE_ALL"] == "true"

          affected = set()
          test_libraries = set()

          global_files = {
              "build.gradle",
              "settings.gradle",
              "gradle.properties",
              "gradle/libs.versions.toml",
              "gradlew",
              "gradlew.bat",
          }

          global_prefixes = (
              "gradle/",
              ".github/",
          )

          # 这些文件变化时，全量检查
          if force_all or any(
              path in global_files or path.startswith(global_prefixes)
              for path in changed
          ):
              affected.update(apps)
              test_libraries.add("shared-sms-parser")

          else:
              for path in changed:
                  parts = PurePosixPath(path).parts

                  if not parts:
                      continue

                  module = parts[0]

                  # shared 被大多数插件依赖
                  if module == "shared":
                      affected.update(apps)

                  # shared-sms-parser 只影响出行建议插件
                  elif module == "shared-sms-parser":
                      affected.add("plugin-travel-suggestion")
                      test_libraries.add("shared-sms-parser")

                  # 插件自身发生变化
                  elif module in apps:
                      affected.add(module)

              # 出行插件变化时，同时运行解析库测试
              if "plugin-travel-suggestion" in affected:
                  test_libraries.add("shared-sms-parser")

          affected = [
              module
              for module in apps
              if module in affected
          ]

          test_tasks = [
              f":{module}:test"
              for module in affected
          ]

          test_tasks += [
              f":{module}:test"
              for module in sorted(test_libraries)
          ]

          build_tasks = [
              f":{module}:assembleDebug"
              for module in affected
          ]

          print("Affected modules:", ", ".join(affected) or "none")
          print("Test tasks:", " ".join(test_tasks) or "none")
          print("Build tasks:", " ".join(build_tasks) or "none")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(
                  f"has_changes={'true' if test_tasks or build_tasks else 'false'}\n"
              )
              output.write(
                  f"test_tasks={' '.join(test_tasks)}\n"
              )
              output.write(
                  f"build_tasks={' '.join(build_tasks)}\n"
              )
          PY

  test-and-build:
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "MAPS_API_KEY=dummy" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run affected tests
        env:
          TEST_TASKS: ${{ needs.changes.outputs.test_tasks }}
        run: |
          ./gradlew $TEST_TASKS --parallel

      - name: Build affected debug APKs
        env:
          BUILD_TASKS: ${{ needs.changes.outputs.build_tasks }}
        run: |
          ./gradlew $BUILD_TASKS --parallel

      - name: Upload affected APKs
        uses: actions/upload-artifact@v4
        with:
          name: smartspacer-plugins-debug-apks-${{ github.run_number }}
          path: apks/*.apk
          if-no-files-found: error
