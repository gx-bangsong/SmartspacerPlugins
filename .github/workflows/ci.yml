name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Create local.properties
      run: |
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        echo "MAPS_API_KEY=dummy" >> local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run tests with Gradle
      run: |
        ./gradlew :shared-sms-parser:test 2>&1 | tee /tmp/gradle-tests.log
        exit ${PIPESTATUS[0]}

    - name: Surface Gradle failures to step summary
      if: always()
      run: |
        {
          echo "### Gradle diagnostics"
          echo ""
          echo '```'
          grep -E -A6 "What went wrong|FAILURE|Execution failed|error:|e: |Caused by|Could not|unresolved|Configuration problem|> Task .* FAILED" /tmp/gradle-tests.log | head -200 || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Build Debug APKs
      run: |
        ./gradlew :qweather:assembleDebug
        ./gradlew :plugin-water:assembleDebug
        ./gradlew :plugin-food:assembleDebug
        ./gradlew :plugin-medication:assembleDebug
        ./gradlew :plugin-parcel:assembleDebug
        ./gradlew :plugin-travel-suggestion:assembleDebug
        ./gradlew :plugin-check-in:assembleDebug

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: smartspacer-plugins-debug-apks
        path: apks/*.apk
