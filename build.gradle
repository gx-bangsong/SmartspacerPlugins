import com.android.build.gradle.internal.dsl.SigningConfig

buildscript {
    ext.nav_version = "2.7.7"
    ext.protobuf_version = '0.9.0'
    ext.refine_version = '4.4.0'
    ext.room_version = "2.6.1"
    // compileSdk 36 (Android 16). The promoted-ongoing ("Live Update") request and the
    // progress-centric style are provided by androidx.core 1.17.0 compat APIs
    // (NotificationCompat.Builder#setRequestPromotedOngoing, NotificationCompat.ProgressStyle),
    // which need only compileSdk 35/36 — not the 36.1 minor SDK — and are runtime-gated by
    // BuildCompat.isAtLeastB_1() (see LiveUpdateEligibility).
    ext.compile_sdk = 34
    ext.min_sdk = 29
    ext.target_sdk = 34
    dependencies {
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$nav_version"
        classpath "com.google.protobuf:protobuf-gradle-plugin:$protobuf_version"
        classpath "com.google.android.libraries.mapsplatform.secrets-gradle-plugin:secrets-gradle-plugin:2.0.1"
    }
}

// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    // AGP 8.10 supports compileSdk 36 (Android 16); Kotlin 2.2.21 is the newest KGP whose
    // official compatibility matrix covers AGP 8.10.x and Gradle 8.11.1.
    id 'com.android.application' version '8.9.2' apply false
    id 'com.android.library' version '8.9.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.21' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.21' apply false
    id 'com.google.devtools.ksp' version '2.2.21-2.0.5' apply false
    id 'dev.rikka.tools.refine' version "$refine_version" apply false
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin' version '2.0.1' apply false
}

def getKeystoreProperties() {
    def properties = new Properties()
    properties.setProperty("keyAlias", "")
    properties.setProperty("keyPassword", "")
    properties.setProperty("storeFile", "")
    properties.setProperty("storePassword", "")
    try {
        def propertiesFile = rootProject.file("keystore.properties")
        if (propertiesFile.exists()) {
            properties.load(new FileInputStream(propertiesFile))
        }
    } catch (Exception ignored) {
        properties = null
        println "Unable to read keystore"
    }
    return properties
}

ext {
    signingConfigs = {
        release {
            def keystore = getKeystoreProperties()
            if (keystore != null && keystore.getProperty("storeFile")) {
                storeFile file(keystore.getProperty("storeFile"))
                storePassword keystore.getProperty("storePassword")
                keyAlias keystore.getProperty("keyAlias")
                keyPassword keystore.getProperty("keyPassword")
            }
        }
    }
    outputFileDir = "../../../../../apks"
}

tasks.register('clean', Delete) {
    delete "apks"
}