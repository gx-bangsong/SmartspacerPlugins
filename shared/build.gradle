plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id 'androidx.navigation.safeargs.kotlin'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.kieronquinn.app.shared'
    compileSdk 36

    defaultConfig {
        minSdk min_sdk
        targetSdk target_sdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    //AndroidX + Material
    // 1.17.0 adds NotificationCompat.Builder#setRequestPromotedOngoing and
    // NotificationCompat.ProgressStyle (promoted ongoing "Live Update" support).
    api 'androidx.core:core-ktx:1.13.1'
    api 'androidx.appcompat:appcompat:1.7.0'
    api 'com.google.android.material:material:1.12.0'
    api "androidx.navigation:navigation-fragment-ktx:$nav_version"
    api "androidx.navigation:navigation-ui-ktx:$nav_version"

    //Hidden APIs

    //Smartspacer SDK
    api 'com.kieronquinn.smartspacer:sdk-plugin:1.0.3'

    //Dependency Injection
    api "io.insert-koin:koin-android:3.5.6"

    //Theming

    //Image Loading

    //Data Loading

    //Used in Backup + Restore

    //Room for data storage
    api "androidx.room:room-runtime:$room_version"
    api "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    compileOnly project(path: ':systemstubs')

    //Testing
    testImplementation "junit:junit:4.13.2"
}